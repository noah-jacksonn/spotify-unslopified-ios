name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  swift-checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run focused checks
        run: |
          for check in tests/run-*-tests.sh; do
            zsh "$check" || exit 1
          done
